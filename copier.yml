_min_copier_version: "9.0"
_subdirectory: "template/{{ kind }}"
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

kind:
  type: str
  help: What are you building?
  choices:
    "dashboard: where people land (sign-in, orgs, nav, dashboards)": dashboard
    "frontend: a React app for one job, with web components for dashboards": frontend
    "backend: a Django API for a frontend, for data no existing system holds": backend

slug:
  type: str
  help: Short name, lowercase, e.g. planner
  validator: >-
    {% if not (slug | regex_search('^[a-z][a-z0-9-]{1,30}$')) %}lowercase letters, digits and hyphens, starting with a letter{% endif %}

name:
  type: str
  help: Name people see
  default: "{{ slug | replace('-', ' ') | title }}"

backend:
  type: str
  help: Where does this frontend's data live?
  when: "{{ kind == 'frontend' }}"
  choices:
    "a new backend (Django API made from this template)": new
    "an existing system (Taiga, Odoo, anything with OIDC and an API)": existing
  default: new
